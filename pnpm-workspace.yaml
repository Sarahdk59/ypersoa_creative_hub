packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  protobufjs: true
  sharp: true
  unrs-resolver: true
  esbuild: true
  # false : son postinstall ne télécharge que les binaires GPU (CUDA), dont l'URL GitHub
  # renvoie 404 → faisait échouer le build Railway. Les binaires CPU sont inclus dans le paquet.
  onnxruntime-node: false
